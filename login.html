<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stargicinvestment - Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#ffffff;
}

/* ANIMATION */
.wrapper{
  width:100%;
  max-width:420px;
  padding:20px;
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

/* BRAND */
.brand{
  text-align:center;
  margin-bottom:20px;
}

.brand h1{
  font-size:28px;
  font-weight:700;
  color:#0f172a;
}

.brand p{
  font-size:13px;
  color:#64748b;
  margin-top:5px;
}

/* CARD */
.card{
  background:#ffffff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:32px;
  box-shadow:0 8px 25px rgba(0,0,0,0.05);
}

.title{
  font-size:18px;
  font-weight:600;
  color:#0f172a;
  text-align:center;
  margin-bottom:20px;
}

/* INPUT */
.input-group{
  margin-bottom:14px;
  position:relative;
}

.input-group input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #d1d5db;
  background:#f9fafb;
  font-size:14px;
  outline:none;
  color:#0f172a;
  transition:0.2s;
}

.input-group input:focus{
  border-color:#00c853;
  background:#ffffff;
  box-shadow:0 0 0 3px rgba(0,200,83,0.1);
}

/* PASSWORD TOGGLE */
.toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  cursor:pointer;
  font-size:12px;
  color:#6b7280;
  user-select:none;
}

/* ERROR */
.error{
  font-size:12px;
  color:#ef4444;
  margin-top:6px;
  display:none;
}

/* BUTTON */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#00c853;
  color:#000;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  transition:0.2s;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

button:hover{
  background:#00b34a;
}

/* SPINNER */
.spinner{
  width:14px;
  height:14px;
  border:2px solid #000;
  border-top:2px solid transparent;
  border-radius:50%;
  display:none;
  animation:spin 0.7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* REGISTER */
.register{
  margin-top:15px;
  text-align:center;
  font-size:13px;
  color:#475569;
}

.register a{
  color:#00c853;
  font-weight:600;
  text-decoration:none;
}

/* TRUST */
.trust{
  margin-top:12px;
  text-align:center;
  font-size:11px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="brand">
    <h1>Stargicinvestment</h1>
  </div>

  <div class="card">

    <div class="title">Sign in to continue</div>

    <!-- EMAIL -->
    <div class="input-group">
      <input type="email" id="email" placeholder="Email address">
      <div class="error" id="emailErr">Enter valid email</div>
    </div>

    <!-- PASSWORD -->
    <div class="input-group">
      <input type="password" id="password" placeholder="Password">
      <span class="toggle" onclick="togglePass()">Show</span>
      <div class="error" id="passErr">Password required</div>
    </div>

    <button onclick="login()" id="loginBtn">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Login</span>
    </button>

    <div class="register">
      New here? <a href="register.html">Create account</a>
    </div>

<footer style="text-align:center; margin-top:18px; font-size:11px; color:#94a3b8;">
  © 2026 Stargicinvestment. All rights reserved.
</footer>
      

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDGsQ3Q7JHVvNlKAQi3l5HSZBZrP_FVoBk",
  authDomain: "stargicinvestment.firebaseapp.com",
  projectId: "stargicinvestment",
  storageBucket: "stargicinvestment.appspot.com",
  messagingSenderId: "1053305294931",
  appId: "1:1053305294931:web:87cba3260a83030e56f6a6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* AUTO LOGIN */
onAuthStateChanged(auth, (user)=>{
  if(user){
    location.href = "dashboard.html";
  }
});

/* TOGGLE PASSWORD */
window.togglePass = function(){
  const pass = document.getElementById("password");
  pass.type = pass.type === "password" ? "text" : "password";
};

/* LOGIN */
window.login = async function(){

  const btn = document.getElementById("loginBtn");
  const spinner = document.getElementById("spinner");
  const text = document.getElementById("btnText");

  btn.disabled = true;
  spinner.style.display = "block";
  text.innerText = "Signing in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  document.getElementById("emailErr").style.display = email ? "none" : "block";
  document.getElementById("passErr").style.display = password ? "none" : "block";

  if(!email || !password){
    btn.disabled = false;
    spinner.style.display = "none";
    text.innerText = "Login";
    return;
  }

  try{

    const userCred = await signInWithEmailAndPassword(auth, email, password);
    const user = userCred.user;

    const userRef = doc(db,"users",user.uid);
    const snap = await getDoc(userRef);

    if(snap.exists() && snap.data().admin === true){
      location.href = "admin.html";
    }else{
      location.href = "dashboard.html";
    }

  catch(err){
  console.error("LOGIN ERROR:", err.code, err.message);

  if(err.code === "auth/user-not-found"){
    alert("User does not exist");
  }
  else if(err.code === "auth/wrong-password"){
    alert("Wrong password");
  }
  else if(err.code === "auth/invalid-credential"){
    alert("Invalid email or password");
  }
  else if(err.code === "auth/too-many-requests"){
    alert("Too many attempts. Try again later");
  }
  else{
    alert("Login error: " + err.message);
  }
  }

</script>

</body>
        </html>
